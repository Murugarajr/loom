<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Chrome Linear Gradient (Front Face) -->
    <linearGradient id="chromeFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#f0f4f8"/>
      <stop offset="38%" stop-color="#b8c7d8"/>
      <stop offset="48%" stop-color="#607185"/>
      <stop offset="50%" stop-color="#2a3543"/>
      <stop offset="54%" stop-color="#47576a"/>
      <stop offset="78%" stop-color="#c4d2e2"/>
      <stop offset="92%" stop-color="#eaf0f8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Chrome Bevel Gradient (Top / Highlights) -->
    <linearGradient id="chromeBevelTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d0dbe7"/>
      <stop offset="100%" stop-color="#8ba0b7"/>
    </linearGradient>

    <!-- Chrome Bevel Gradient (Bottom / Shadows) -->
    <linearGradient id="chromeBevelBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2733"/>
      <stop offset="50%" stop-color="#3d4c5e"/>
      <stop offset="100%" stop-color="#141b24"/>
    </linearGradient>

    <!-- Optical Cyan Laser Glow Gradient -->
    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006699" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#00d4ff"/>
      <stop offset="70%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- 3D Extrusion Shadow Filter -->
    <filter id="chromeExtrude" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Star Flare Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 3D Extrusion Depth Layer (Beneath Front Faces) -->
  <g filter="url(#chromeExtrude)" fill="url(#chromeBevelBottom)">
    <!-- L Extrusion -->
    <path d="M 45 35 L 85 35 L 85 95 L 140 95 L 140 135 L 45 135 Z" transform="translate(0, 4)"/>
    <!-- O1 Extrusion -->
    <path fill-rule="evenodd" d="M 215 35 C 255 35, 275 60, 275 85 C 275 110, 255 135, 215 135 C 175 135, 155 110, 155 85 C 155 60, 175 35, 215 35 Z M 215 62 C 235 62, 245 72, 245 85 C 245 98, 235 108, 215 108 C 195 108, 185 98, 185 85 C 185 72, 195 62, 215 62 Z" transform="translate(0, 4)"/>
    <!-- O2 Extrusion -->
    <path fill-rule="evenodd" d="M 335 35 C 375 35, 395 60, 395 85 C 395 110, 375 135, 335 135 C 295 135, 275 110, 275 85 C 275 60, 295 35, 335 35 Z M 335 62 C 355 62, 365 72, 365 85 C 365 98, 355 108, 335 108 C 315 108, 305 98, 305 85 C 305 72, 315 62, 335 62 Z" transform="translate(0, 4)"/>
    <!-- M Extrusion -->
    <path d="M 410 135 L 410 35 L 450 35 L 475 75 L 500 35 L 540 35 L 540 135 L 505 135 L 505 75 L 485 105 L 465 105 L 445 75 L 445 135 Z" transform="translate(0, 4)"/>
  </g>

  <!-- Main Front Chrome Letterforms -->
  <g fill="url(#chromeFace)" stroke="url(#chromeBevelTop)" stroke-width="1.5">
    <!-- Letter L -->
    <path d="M 45 35 L 85 35 L 85 95 L 140 95 L 140 135 L 45 135 Z"/>

    <!-- Letter O (First Optical Disc) -->
    <path fill-rule="evenodd" d="M 215 35 C 255 35, 275 60, 275 85 C 275 110, 255 135, 215 135 C 175 135, 155 110, 155 85 C 155 60, 175 35, 215 35 Z M 215 62 C 235 62, 245 72, 245 85 C 245 98, 235 108, 215 108 C 195 108, 185 98, 185 85 C 185 72, 195 62, 215 62 Z"/>

    <!-- Letter O (Second Optical Disc) -->
    <path fill-rule="evenodd" d="M 335 35 C 375 35, 395 60, 395 85 C 395 110, 375 135, 335 135 C 295 135, 275 110, 275 85 C 275 60, 295 35, 335 35 Z M 335 62 C 355 62, 365 72, 365 85 C 365 98, 355 108, 335 108 C 315 108, 305 98, 305 85 C 305 72, 315 62, 335 62 Z"/>

    <!-- Letter M -->
    <path d="M 410 135 L 410 35 L 450 35 L 475 75 L 500 35 L 540 35 L 540 135 L 505 135 L 505 75 L 485 105 L 465 105 L 445 75 L 445 135 Z"/>
  </g>

  <!-- Internal Inset Specular Ridge on Letterforms -->
  <g fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.75">
    <path d="M 48 38 L 82 38 L 82 98 L 137 98 L 137 132 L 48 132 Z"/>
    <path d="M 413 132 L 413 38 L 447 38 L 475 80 L 503 38 L 537 38 L 537 132 L 508 132 L 508 78 L 483 108 L 467 108 L 442 78 L 442 132 Z"/>
  </g>

  <!-- Optical Cyber-Thread (Weaving through the two 'O' discs in infinity loop) -->
  <g>
    <!-- Glow halo -->
    <path d="M 120 85 C 160 55, 215 55, 275 85 C 335 115, 390 115, 430 85" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0.3" filter="url(#starGlow)"/>
    <!-- Core laser beam -->
    <path d="M 120 85 C 160 55, 215 55, 275 85 C 335 115, 390 115, 430 85" fill="none" stroke="url(#cyanLaser)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Pure white inner photon beam -->
    <path d="M 120 85 C 160 55, 215 55, 275 85 C 335 115, 390 115, 430 85" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Glowing Optical Disc Centers -->
  <circle cx="215" cy="85" r="5" fill="#00f0ff" filter="url(#starGlow)"/>
  <circle cx="215" cy="85" r="2" fill="#ffffff"/>
  <circle cx="335" cy="85" r="5" fill="#00f0ff" filter="url(#starGlow)"/>
  <circle cx="335" cy="85" r="2" fill="#ffffff"/>

  <!-- Specular Star Flares on Chrome Edges -->
  <g transform="translate(45, 35)">
    <ellipse cx="0" cy="0" rx="6" ry="1.2" fill="#ffffff" filter="url(#starGlow)"/>
    <ellipse cx="0" cy="0" rx="1.2" ry="6" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>
  <g transform="translate(475, 75)">
    <ellipse cx="0" cy="0" rx="8" ry="1.5" fill="#ffffff" filter="url(#starGlow)"/>
    <ellipse cx="0" cy="0" rx="1.5" ry="8" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    <circle cx="0" cy="0" r="4" fill="#00f0ff" opacity="0.6"/>
  </g>
  <g transform="translate(355, 38)">
    <ellipse cx="0" cy="0" rx="5" ry="1" fill="#ffffff" filter="url(#starGlow)"/>
    <ellipse cx="0" cy="0" rx="1" ry="5" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
  </g>
</svg>
